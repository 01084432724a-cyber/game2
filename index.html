<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지구인을 납치해라!</title>
<style>
:root{--bg:#0b0d24;--ink:#f3f1ff;--muted:#b9b5e6;--beam:#b6ff3c;--beam-ink:#10210a;--shade:rgba(8,8,30,.84);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d24;--ink:#f3f1ff}}
:root[data-theme="dark"]{--bg:#0b0d24;--ink:#f3f1ff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.stage{position:relative;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .6429));aspect-ratio:360/560;container-type:inline-size;overflow:hidden;border-radius:12px}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:2cqw;left:0;right:0;padding:0 4cqw;display:grid;grid-template-columns:1fr 1fr;row-gap:1cqw;font-size:4.6cqw;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none}
.hud div:nth-child(even){text-align:right}
.hud b{font-size:1.25em;color:var(--beam)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;background:var(--shade);text-align:center;padding:8cqw}
.ov[hidden]{display:none}
.ov .big{font-size:18cqw;line-height:1}
.ov h1,.ov h2{margin:0;font-size:9cqw;font-weight:900}
.ov p{margin:0;font-size:4.3cqw;line-height:1.55;color:var(--muted)}
.ov .score{font-size:6cqw;color:var(--ink)}
.ov .score b{color:var(--beam);font-size:1.5em}
button{font:inherit;font-size:5.2cqw;font-weight:800;padding:3cqw 10cqw;margin-top:2cqw;border:0;border-radius:99px;background:var(--beam);color:var(--beam-ink);cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div>점수 <b id="sc">0</b></div>
    <div>남은 시간 <b id="tm">90</b>초</div>
    <div id="lv"></div>
    <div id="cb"></div>
  </div>
  <div class="ov" id="startOv">
    <div class="big">🛸</div>
    <h1>지구인을 납치해라!</h1>
    <p>UFO가 지나갈 때 스페이스바나 화면을 눌러 광선을 쏘세요.<br>목숨은 3개, 제한 시간은 90초예요.<br>🐄는 점수 2배! 연속으로 성공하면 배수가 올라가요.</p>
    <button id="startBtn">시작하기</button>
  </div>
  <div class="ov" id="overOv" hidden>
    <div class="big">🧍</div>
    <h2 id="ovTitle">게임 오버</h2>
    <p class="score">최종 점수 <b id="final">0</b>점</p>
    <button id="againBtn">다시 하기</button>
  </div>
</div>
<script>
(()=>{
const W=360,H=560,GY=494,UY=92,TIME=90,FF="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const sc=$('sc'),tm=$('tm'),lv=$('lv'),cb=$('cb'),startOv=$('startOv'),overOv=$('overOv');
const stars=Array.from({length:42},()=>({x:Math.random()*W,y:10+Math.random()*320,s:8+Math.random()*8,p:1+Math.random()*2}));
const trees=[22,96,168,262,336];
let state='ready',score=0,lives=3,combo=0,t=0,clock=0,spawnIn=0,flash=0;
let ufo={x:W/2,dir:1},target=null,beam=null,pops=[];
const mult=c=>c>=4?3:c>=2?2:1;

function spawn(){
  target={cow:Math.random()<.2,x:40+Math.random()*(W-80),walk:t>=30&&Math.random()<.5,vx:(Math.random()<.5?-1:1)*45,lift:0,state:'idle'};
}
function reset(){
  score=0;lives=3;combo=0;t=0;flash=0;beam=null;pops=[];ufo={x:W/2,dir:1};
  state='play';spawn();startOv.hidden=true;overOv.hidden=true;
}
function end(reason){
  state='over';beam=null;
  $('ovTitle').textContent=reason==='life'?'목숨을 모두 잃었어요':'시간 종료!';
  $('final').textContent=score;overOv.hidden=false;
}
function fire(){
  if(state!=='play'||beam)return;
  const hit=target&&target.state==='idle'&&Math.abs(ufo.x-target.x)<=24;
  beam={x:ufo.x,t:0};
  if(hit){
    combo++;
    const p=(target.cow?2:1)*mult(combo);
    score+=p;target.state='lift';spawnIn=.15;
    pops.push({x:target.x,y:GY-50,tx:'+'+p,c:'#ffd84a',l:1});
  }else{
    lives--;combo=0;flash=.3;
    pops.push({x:ufo.x,y:GY-50,tx:'빗나감!',c:'#ff6b81',l:1});
  }
}
function update(dt){
  clock+=dt;if(flash>0)flash-=dt;
  pops.forEach(p=>{p.l-=dt*1.1;p.y-=30*dt});pops=pops.filter(p=>p.l>0);
  if(state!=='play')return;
  t+=dt;
  if(beam){
    beam.t+=dt;
    if(beam.t>=.35){beam=null;if(lives<=0){end('life');return}}
  }else{
    ufo.x+=ufo.dir*(150+t*2.1)*dt;
    if(ufo.x>W-34){ufo.x=W-34;ufo.dir=-1}
    if(ufo.x<34){ufo.x=34;ufo.dir=1}
  }
  if(target){
    if(target.state==='lift'){target.lift+=520*dt;if(target.lift>GY-UY-10)target=null}
    else if(target.walk){
      target.x+=target.vx*dt;
      if(target.x>W-30||target.x<30){target.vx*=-1;target.x=Math.max(30,Math.min(W-30,target.x))}
    }
  }
  if(!target){spawnIn-=dt;if(spawnIn<=0)spawn()}
  if(t>=TIME)end('time');
}
function em(s,x,y,z,a=1){ctx.globalAlpha=a;ctx.font=z+'px '+FF;ctx.fillText(s,x,y);ctx.globalAlpha=1}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0b22');g.addColorStop(.6,'#2b1760');g.addColorStop(1,'#5b2a7a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  stars.forEach(s=>em('⭐',s.x,s.y,s.s,Math.max(.12,.35+.45*Math.sin(clock*s.p+s.x))));
  ctx.fillStyle='#10231f';ctx.fillRect(0,GY+10,W,H-GY-10);
  trees.forEach(x=>em('🌳',x,GY-6,40));
  if(target){
    const bob=target.walk&&target.state==='idle'?Math.sin(clock*14)*2:0;
    const a=target.state==='lift'?Math.max(.2,1-target.lift/(GY-UY)):1;
    em(target.cow?'🐄':'🧍',target.x,GY-6-target.lift+bob,target.cow?42:38,a);
  }
  if(beam){
    const p=Math.min(1,beam.t/.12),a=beam.t<.2?.6:Math.max(0,.6-(beam.t-.2)*4);
    const y0=UY+24,y1=y0+(GY+4-y0)*p,w1=7+17*p;
    const bg=ctx.createLinearGradient(0,y0,0,y1);
    bg.addColorStop(0,'rgba(182,255,60,'+a+')');bg.addColorStop(1,'rgba(182,255,60,'+a*.35+')');
    ctx.fillStyle=bg;ctx.beginPath();
    ctx.moveTo(beam.x-7,y0);ctx.lineTo(beam.x+7,y0);ctx.lineTo(beam.x+w1,y1);ctx.lineTo(beam.x-w1,y1);
    ctx.closePath();ctx.fill();
  }
  em('🛸',ufo.x,UY,52);
  pops.forEach(p=>{
    ctx.globalAlpha=Math.min(1,p.l);ctx.font='800 24px sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(p.tx,p.x,p.y);
    ctx.fillStyle=p.c;ctx.fillText(p.tx,p.x,p.y);ctx.globalAlpha=1;
  });
  if(flash>0){ctx.fillStyle='rgba(255,70,100,'+flash*.5+')';ctx.fillRect(0,0,W,H)}
}
function hud(){
  sc.textContent=score;
  tm.textContent=state==='ready'?TIME:Math.max(0,Math.ceil(TIME-t));
  if(lv._k!==lives){
    lv._k=lives;
    lv.innerHTML=[0,1,2].map(i=>'<span style="opacity:'+(i<lives?1:.25)+'">❤️</span>').join('');
  }
  cb.textContent='연속 '+combo+' · 배수 ×'+mult(combo);
}
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  update(dt);draw();hud();requestAnimationFrame(loop);
}
$('startBtn').onclick=reset;
$('againBtn').onclick=reset;
cv.addEventListener('pointerdown',e=>{e.preventDefault();fire()});
addEventListener('keydown',e=>{
  if(e.code==='Space'&&state==='play'){e.preventDefault();if(!e.repeat)fire()}
});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
